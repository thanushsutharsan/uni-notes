{% load static %}
<article class="note-card">
    <a class="cover" href="{{ note.get_absolute_url }}" aria-label="View {{ note.title }}">
        {% if note.cover_url %}
            <img
                src="{{ note.cover_url }}"
                alt="Cover for {{ note.title }}"
                onerror="if (this.dataset.fallbackApplied) { this.onerror=null; this.src='{% static 'images/subjects/fallback.png' %}'; } else { this.dataset.fallbackApplied='1'; this.src='{% static 'images/subjects/' %}{{ note.subject.slug }}.png'; }">
        {% else %}
            <img
                src="{% static 'images/subjects/' %}{{ note.subject.slug }}.png"
                alt="{{ note.subject.name }} study notes cover"
                onerror="this.onerror=null;this.src='{% static 'images/subjects/fallback.png' %}';">
        {% endif %}
    </a>
    <div class="note-card-body">
        <span class="note-subject">{{ note.subject.name }}</span>
        <h3><a href="{{ note.get_absolute_url }}">{{ note.title }}</a></h3>
        <div class="note-card-footer">
            <strong>£{{ note.price }}</strong>
            <a class="button button-small" href="{{ note.get_absolute_url }}">View</a>
        </div>
    </div>
</article>
